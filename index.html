<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Convite Especial para Date ❤️</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #121212;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .phone-container {
      width: 360px;
      height: 720px;
      background: linear-gradient(180deg, #d32f2f 0%, #8e0000 100%);
      border-radius: 40px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
      border: 8px solid #222;
    }

    .phone-container::before {
      content: "";
      position: absolute;
      top: 10px;
      width: 120px;
      height: 25px;
      background-color: #222;
      border-radius: 15px;
      z-index: 10;
    }

    .screen {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: white;
      z-index: 2;
    }

    .hidden {
      display: none !important;
    }

    .emoji {
      font-size: 65px;
      margin-bottom: 15px;
    }

    .final-image {
      width: 160px;
      height: 160px;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid #ffffff;
      margin-bottom: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    h2 {
      font-size: 1.3rem;
      margin-bottom: 25px;
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: 1px;
      line-height: 1.3;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 260px;
      align-items: center;
    }

    .btn-row {
      display: flex;
      gap: 15px;
      width: 100%;
      justify-content: center;
    }

    button, .btn {
      width: 100%;
      background-color: #ffffff;
      color: #d32f2f;
      border: none;
      padding: 12px 20px;
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: all 0.2s;
    }

    button:hover {
      background-color: #ffebee;
      transform: translateY(-2px);
    }

    button:active {
      transform: scale(0.95);
    }

    #btn-no {
      position: relative;
    }

    .summary-box {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 15px;
      padding: 12px 15px;
      width: 100%;
      text-align: left;
      margin-bottom: 15px;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .summary-box p strong {
      color: #ffeb3b;
    }

    .btn-whatsapp {
      background-color: #25d366 !important;
      color: white !important;
    }
  </style>
</head>
<body>

  <div class="phone-container">

    <!-- TELA 1: Convite Principal -->
    <div class="screen" id="screen1">
      <div class="emoji">❤️</div>
      <h2>Oii Be, quer ir em um Date comigo?</h2>
      <div class="btn-group btn-row">
        <button id="btn-yes">SIM!</button>
        <button id="btn-no">Não</button>
      </div>
    </div>

    <!-- TELA 2: Escolha do Dia -->
    <div class="screen hidden" id="screen2">
      <div class="emoji">📅</div>
      <h2>Qual dia fica melhor para você?</h2>
      <div class="btn-group">
        <button onclick="selectOption('dia', 'Sexta-feira', 'screen2', 'screen3')">Sexta-feira</button>
        <button onclick="selectOption('dia', 'Sábado', 'screen2', 'screen3')">Sábado</button>
        <button onclick="selectOption('dia', 'Domingo', 'screen2', 'screen3')">Domingo</button>
        <button onclick="selectOption('dia', 'Outro dia', 'screen2', 'screen3')">Outro dia (Combinamos)</button>
      </div>
    </div>

    <!-- TELA 3: Escolha do Passeio -->
    <div class="screen hidden" id="screen3">
      <div class="emoji">✨</div>
      <h2>O que você prefere fazer?</h2>
      <div class="btn-group">
        <button onclick="selectOption('passeio', 'Jantar Romântico', 'screen3', 'screen4')">Jantar Romântico 🍽️</button>
        <button onclick="selectOption('passeio', 'Cinema + Pipoca', 'screen3', 'screen4')">Cinema + Pipoca 🍿</button>
        <button onclick="selectOption('passeio', 'Picnic no Parque', 'screen3', 'screen4')">Picnic no Parque 🧺</button>
        <button onclick="selectOption('passeio', 'Surpresa!', 'screen3', 'screen4')">Surpresa! ✨</button>
      </div>
    </div>

    <!-- TELA 4: Escolha da Comida -->
    <div class="screen hidden" id="screen4">
      <div class="emoji">🍕</div>
      <h2>O que vamos comer?</h2>
      <div class="btn-group">
        <button onclick="selectOption('comida', 'Lanche / Hambúrguer', 'screen4', 'screen5')">Lanche / Hambúrguer 🍔</button>
        <button onclick="selectOption('comida', 'Comida Japonesa', 'screen4', 'screen5')">Comida Japonesa 🍣</button>
        <button onclick="selectOption('comida', 'Pizza', 'screen4', 'screen5')">Pizza 🍕</button>
        <button onclick="selectOption('comida', 'Massa / Italiano', 'screen4', 'screen5')">Massa / Italiano 🍝</button>
      </div>
    </div>

    <!-- TELA 5: Escolha do Outfit -->
    <div class="screen hidden" id="screen5">
      <div class="emoji">👗</div>
      <h2>Qual o dress code do nosso date?</h2>
      <div class="btn-group">
        <button onclick="selectOption('roupa', 'Chique / Arrumado', 'screen5', 'screen6')">Chique / Elegante 💃</button>
        <button onclick="selectOption('roupa', 'Casual', 'screen5', 'screen6')">Casual 😊</button>
        <button onclick="selectOption('roupa', 'Confortável / Despojado', 'screen5', 'screen6')">Confortável 👟</button>
        <button onclick="selectOption('roupa', 'Você escolhe!', 'screen5', 'screen6')">Você escolhe! 😉</button>
      </div>
    </div>

      <p style="margin-bottom: 10px; font-size: 0.9rem;">Aqui estão as escolhas do nosso encontro:</p>
      
      <div class="summary-box">
        <p>📅 <strong>Dia:</strong> <span id="summary-dia"></span></p>
        <p>✨ <strong>Passeio:</strong> <span id="summary-passeio"></span></p>
        <p>🍕 <strong>Comida:</strong> <span id="summary-comida"></span></p>
        <p>👗 <strong>Outfit:</strong> <span id="summary-roupa"></span></p>

      <div class="btn-group">
        <button class="btn-whatsapp" onclick="sendWhatsApp()">Confirmar no WhatsApp 📲</button>
      </div>
    </div>

  </div>

  <script>
    const choices = {
      dia: '',
      passeio: '',
      comida: '',
      roupa: ''
    };

    const btnYes = document.getElementById('btn-yes');
    const btnNo = document.getElementById('btn-no');

    btnYes.addEventListener('click', () => {
      document.getElementById('screen1').classList.add('hidden');
      document.getElementById('screen2').classList.remove('hidden');
    });

    function moverBotaoNao() {
      const x = Math.random() * 160 - 80;
      const y = Math.random() * 160 - 80;
      btnNo.style.transform = `translate(${x}px, ${y}px)`;
    }

    btnNo.addEventListener('mouseover', moverBotaoNao);
    btnNo.addEventListener('touchstart', moverBotaoNao);

    function selectOption(category, value, currentScreenId, nextScreenId) {
      choices[category] = value;
      document.getElementById(currentScreenId).classList.add('hidden');
      document.getElementById(nextScreenId).classList.remove('hidden');

      if (nextScreenId === 'screen6') {
        document.getElementById('summary-dia').innerText = choices.dia;
        document.getElementById('summary-passeio').innerText = choices.passeio;
        document.getElementById('summary-comida').innerText = choices.comida;
        document.getElementById('summary-roupa').innerText = choices.roupa;
      }
    }

    function sendWhatsApp() {
      const phoneNumber = "5519993811807"; 
      
      const text = `Oii! Aceitei seu convite de date! ❤️%0A%0A` +
                   `📅 *Dia:* ${choices.dia}%0A` +
                   `✨ *Passeio:* ${choices.passeio}%0A` +
                   `🍕 *Comida:* ${choices.comida}%0A` +
                   `👗 *Outfit:* ${choices.roupa}%0A%0A` +
                   `Mal posso esperar! 🥰`;

      window.open(`https://wa.me/${phoneNumber}?text=${text}`, '_blank');
    }
  </script>
